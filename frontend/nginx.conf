server { listen 80; server_name _; root /usr/share/nginx/html; location = /index.html { add_header Cache-Control "no-cache" always; } location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; } location = /sw.js { add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; } location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; } location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; } }
